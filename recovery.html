<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#0f0f17" />
		<meta name="robots" content="noindex,nofollow" />
		<meta
			http-equiv="Content-Security-Policy"
			content="default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'none'; script-src 'unsafe-inline' 'unsafe-eval'; script-src-attr 'none'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; frame-src 'none'"
		/>
		<title>Shards Offline Recovery</title>
	</head>
	<body>
		<main class="container py-4 py-md-5">
			<header class="mb-4 pb-3 border-bottom">
				<h1 class="h3 mb-1">Shards Offline Recovery</h1>
				<p class="text-secondary mb-0">A standalone page for reconstructing a Shards backup without a network connection.</p>
			</header>

			<div id="error" class="alert alert-danger d-none" role="alert"></div>

			<section id="inputs" class="mb-4">
				<p class="text-secondary">Enter the required shard UR strings. This page does not send or store them anywhere.</p>
				<div id="share-inputs"></div>
				<button id="add-share" class="btn btn-sm btn-outline-secondary" type="button">+ Add Another Shard</button>
			</section>

			<div class="d-grid mb-4">
				<button id="reconstruct" class="btn btn-primary btn-lg" type="button">Reconstruct</button>
			</div>

			<section id="result" class="card border-success d-none">
				<div id="result-title" class="card-header bg-success text-white"></div>
				<div id="result-body" class="card-body"></div>
			</section>
		</main>
		<script type="module" src="/src/recovery.js"></script>
	</body>
</html>
